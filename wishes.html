<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letters & Wishes — Emma 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&family=Caveat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.page-head {
  padding: 120px 0 60px;
  text-align: center;
}
.page-head .eyebrow { margin-bottom: 22px; }
.page-head h1 {
  font-size: clamp(64px, 9vw, 132px);
  letter-spacing: -0.015em;
  line-height: 0.95;
}
.page-head h1 .em { font-style: italic; color: var(--sage-deep); }
.page-head .lede {
  max-width: 540px; margin: 28px auto 0;
  font-family: var(--serif); font-style: italic;
  font-size: 20px; line-height: 1.55; color: var(--ink-soft);
}

.wall-wrap {
  position: relative;
  padding: 80px 0 140px;
  overflow: hidden;
}

/* String + lights row */
.string-row {
  position: relative;
  width: 100%;
  height: 14px;
  pointer-events: none;
}
.string-row svg { display: block; width: 100%; height: 100%; overflow: visible; }
.lights {
  position: absolute; inset: 0;
  pointer-events: none;
}
.light {
  position: absolute;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #FFE9B0;
  box-shadow:
    0 0 8px 2px rgba(255, 220, 140, 0.7),
    0 0 18px 4px rgba(255, 200, 110, 0.35);
  animation: twinkle 3.6s ease-in-out infinite;
}
.light.b { background: #FFD7B5; box-shadow: 0 0 8px 2px rgba(255,200,160,0.65), 0 0 16px 4px rgba(255,180,140,0.3); }
.light.c { background: #FFF1D1; box-shadow: 0 0 9px 2px rgba(255,235,180,0.65), 0 0 18px 5px rgba(255,220,160,0.28); }
@keyframes twinkle {
  0%,100% { opacity: 0.55; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.15); }
}

.wall {
  max-width: 1240px;
  margin: 0 auto;
  padding: 60px 36px;
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 56px 32px;
  align-items: start;
}
.wall::before {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at top, rgba(244,217,208,0.15), transparent 60%);
  pointer-events: none;
}

.polaroid {
  position: relative;
  background: #FBF8F2;
  padding: 14px 14px 22px;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.9) inset,
    0 14px 30px -16px rgba(42,39,36,0.35),
    0 4px 10px -6px rgba(42,39,36,0.18);
  transform-origin: top center;
  transition: transform .5s cubic-bezier(.2,.7,.2,1), box-shadow .5s ease, filter .5s ease;
  will-change: transform;
}
.polaroid::before {
  content: "";
  position: absolute;
  top: -10px; left: 50%;
  width: 56px; height: 18px;
  background: rgba(184, 197, 166, 0.45);
  transform: translateX(-50%) rotate(-3deg);
  box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset;
}
.polaroid:nth-child(2n)::before {
  background: rgba(244, 217, 208, 0.6);
  transform: translateX(-50%) rotate(4deg);
}
.polaroid:nth-child(3n)::before {
  background: rgba(237, 230, 218, 0.85);
  transform: translateX(-40%) rotate(-6deg);
}

.polaroid .ratio { width: 100%; }
.polaroid .ph { background-color: var(--blush); }
.polaroid:nth-child(3n) .ph { background-color: var(--sage); }
.polaroid:nth-child(4n) .ph { background-color: var(--cream-deep); }
.polaroid:nth-child(5n) .ph { background-color: var(--blush-deep); }

.polaroid .msg {
  font-family: var(--hand);
  font-size: 22px;
  line-height: 1.25;
  color: var(--ink);
  margin-top: 16px;
  padding: 0 6px;
  min-height: 64px;
}
.polaroid .from {
  font-family: var(--serif);
  font-style: italic;
  font-size: 14px;
  color: var(--ink-mute);
  margin-top: 10px;
  padding: 0 6px;
  display: flex; align-items: center; gap: 8px;
}
.polaroid .from::before {
  content: ""; display: inline-block;
  width: 14px; height: 1px; background: var(--sage-deep);
}

/* scattered angles */
.polaroid:nth-child(8n+1) { transform: rotate(-3.2deg) translateY(6px); }
.polaroid:nth-child(8n+2) { transform: rotate(2.4deg) translateY(-4px); }
.polaroid:nth-child(8n+3) { transform: rotate(-1.6deg) translateY(14px); }
.polaroid:nth-child(8n+4) { transform: rotate(3.6deg) translateY(0); }
.polaroid:nth-child(8n+5) { transform: rotate(-2.2deg) translateY(-8px); }
.polaroid:nth-child(8n+6) { transform: rotate(1.2deg) translateY(8px); }
.polaroid:nth-child(8n+7) { transform: rotate(-3.8deg) translateY(2px); }
.polaroid:nth-child(8n)   { transform: rotate(2.8deg) translateY(-6px); }

.polaroid:hover {
  transform: rotate(0deg) translateY(-10px) scale(1.03);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.9) inset,
    0 30px 50px -18px rgba(42,39,36,0.45),
    0 10px 20px -10px rgba(42,39,36,0.25);
  filter: brightness(1.04);
  z-index: 5;
}

@media (max-width: 1080px) {
  .wall { grid-template-columns: repeat(3, 1fr); gap: 48px 24px; }
}
@media (max-width: 760px) {
  .wall { grid-template-columns: repeat(2, 1fr); gap: 44px 18px; padding: 36px 18px; }
  .polaroid .msg { font-size: 19px; }
}
@media (max-width: 440px) {
  .wall { grid-template-columns: 1fr; }
}

/* Closing note */
.wall-foot {
  text-align: center;
  margin: 80px auto 0;
  max-width: 520px;
  font-family: var(--serif);
  font-style: italic;
  font-size: 20px;
  color: var(--ink-soft);
  line-height: 1.55;
}
.wall-foot .rule { width: 56px; height: 1px; background: var(--sage-deep); margin: 22px auto 0; }
</style>
</head>
<body>

<header data-nav="wishes"></header>

<section class="page-head" data-screen-label="03 Wishes Wall">
  <!-- EDIT: chapter eyebrow -->
  <div class="eyebrow">From the people who love her</div>
  <h1>Letters <span class="em">&amp;</span> Wishes</h1>
  <p class="lede">A handful of notes, pinned up with care — from the people who have been there from the beginning.</p>
</section>

<div class="wall-wrap">

  <!-- top string with lights -->
  <div class="string-row" id="topString" aria-hidden="true">
    <svg viewBox="0 0 1200 14" preserveAspectRatio="none">
      <path d="M0 4 C 200 14, 400 0, 600 8 S 1000 14, 1200 4" fill="none" stroke="#5C5852" stroke-width="0.6" opacity="0.55"/>
    </svg>
    <div class="lights" id="topLights"></div>
  </div>

  <div class="wall" id="wall">
    <!-- polaroids generated by JS below -->
  </div>

  <!-- EDIT: closing note below the polaroid wall -->
  <p class="wall-foot reveal">
    Every wish here is a small promise — that the people who wrote them are still right where she left them, ready to hear how it all goes.
    <span class="rule"></span>
  </p>
</div>

<footer data-footer></footer>

<script src="shared.js"></script>
<script>
// EDIT: add entries here — one object per photo card.
// Fields:
//   photo — (optional) path to a real photo, e.g. "images/wish-01.jpg"
//           Leave as "" to keep the coloured placeholder.
//   msg   — (optional) caption text shown below the photo.
//           Leave as "" for no caption (photo only).
const wishes = [
  { photo: "images/letters-dad.jpeg",     msg: "You once made me a gift where you wrote Be brave, Be strong, Be you. Funny enough this is exactly as I see you, YOU are strong, YOU have always been brave and YOU are YOU. Love you forever. — Dad" },
  { photo: "images/letters-noah.jpeg",    msg: "Emma, du är den starkaste och modigaste personen i världen, och vi är alltid så stolta över dig. Jag kunde inte ha önskat mig en bättre lillasyster. Du är otroligt duktig på allt du gör och har en ljus framtid framför dig. Älskar dig. — Noah" },
  { photo: "images/letters-joel.jpeg",    msg: "Emma, tack för alla åren som den bästa systern. Du lyckas alltid få mig att skratta - även när jag inte har bästa humöret. Du är bäst - you really inspire me to be much better every day. Stort grattis och lycka till i framtiden. — Joel" },
  { photo: "images/letters-auntie.jpeg",  msg: "Du är en tjej med stort mod och ett hjärta av guld. Jag tänker ofta på alla fina minnen från Laxne tillsammans med dina syskon och kusiner, skratt och stunder som gjort sommardagarna och våra träffar speciella. Stort grattis och lycka till i framtiden önskar faster Malin" },
  { photo: "images/letters-cousin.jpeg",  msg: "Emma, när jag tänker på dig så tänker jag på hur roligt vi har det tillsammans, och att det aldrig blir stelt även fast vi inte ses så ofta. Lycka till i framtiden och så får vi se till att behålla våra dagar på Snapchat önskar din favorit kusin!!" },
  { photo: "images/letters-grandpa.jpeg", msg: "Emma, för mig står du alltid på första plats vad du företar dig. Dessutom är du ett underbart barnbarn som jag hoppas få följa länge ännu. Lycka till med allt i din framtid. — Farfar" },
  { photo: "images/letters-sari.jpg",     msg: "Emma- vår prinsessa. Bland fyra grabbar tog du alltid din plats så självklart. Du betyder väldigt mycket för oss alla och jag är stolt över dig. Du kommer lyckas med vad du än väljer framåt. Kramar från Sari, Jakob och Jesper" },
  { photo: "images/letters-mormor.jpg",   msg: "Emma, du är stolt, du är stark, du är modig och du är självständig. Under dom gångna åren har du tagit dig an olika uppgifter, i mina ögon svåra, och du har bara gjort det och det med bravur, så imponerande. Jag hoppas du fortsätter att tro på dig själv, du är bäst! Jag önskar dig all lycka och glädje i framtiden. Kramar från en väldigt stolt mormor" },
  { photo: "images/letters-timi.jpg",     msg: "Congratulations Emma especially on getting into the best university of all time Royal Holloway! I wish you nothing but the best in the future, and don't worry by the time you graduate your jokes will all come true and Emil and I will truly be pushing 30….." },
  { photo: "images/letters-joanne.jpg",   msg: "Dear Emma: I look at this photo and can't believe that you're a senior and graduating!!! How old were you when we met - maybe you were 9? Training in your garage… what an athlete you've become and ready to take on the world. Congrats and good luck in your endeavors. You will be crazy successful no matter what you pursue! Hugs and best wishes, Joanne" },
  { photo: "images/letters-karoline.jpg", msg: "Emma, du är grym som tagit dig förbi denna milstolpe i livet! Fortsätt kämpa och vara den grymma brud som du är! Det är roligt att få följa dig i livet!" },
  { photo: "images/letters-gunilla.jpg",  msg: "Grattis fina Emma till studenten! Vi skickar en massa kramar och lyckönskningar från mammas moster Gunilla med ätteläggar" },
  { photo: "images/letters-peter.jpg",    msg: "Bästa Emma, Även om vi faktiskt aldrig har träffats (i \"mogen\" ålder) så känns det ändå som att jag har fått följa dig lite på håll genom din fantastiska familj. Att du är stark, sportig, smart och har en vilja av stål. Stort grattis till studenten! Hoppas du firar ordentligt och verkligen njuter av dagen — det är du värd. Stora gratulationer, Peter" },
  { photo: "images/letters-nil.jpg",      msg: "Congrats on your graduation Emma! I'm very excited to watch you take the next steps towards your bright future, and I can't wait for you to move to London to create many more memories together! Best, Nil" },
  { photo: "images/letters-mateo.jpg",    msg: "Emma, I'm very grateful to have known you since 4th grade. You are one of the most caring and understanding people I've met, and I want to thank you for all the great memories we've shared. Congratulations, and good luck with your future studies! — Mateo" },
  { photo: "images/letters-ulla.jpg",     msg: "Grattis Emma till den här milstolpen i livet. Bra jobbat och fortsätt framåt så når du dina mål! ❤️ Ulla, Jonas och Charlotte" },
  { photo: "images/letters-kerstin.jpg",  msg: "Emma 🌟 Grattis till studenten 👏🌹 Vi önskar dig all lycka 🍀💖 i framtiden ❣️ Varma kramar 🤗 Kerstin och Kjell-Åke" },
  { photo: "images/letters-lycka.jpg",    msg: "Grattis till studenten Emma!!!\n\nNu väntar nya möjligheter och äventyr. Du behöver inte ha alla svar eller veta exakt vart vägen leder – det viktigaste är att du fortsätter tro på dig själv och går framåt i din egen takt.\n\nVi är så stolta över dig och glada att få fira den här stora dagen tillsammans med dig.\n\nStort grattis och all lycka framåt! 💐💕" },
  { photo: "images/letters-cousin2.jpg",  msg: "Stort grattis till studenten, kusin! Du har kämpat och kommit långt, idag är det din dag. Jag hoppas du firar ordentligt och känner dig stolt över dig själv." },
  { photo: "images/letters-jp.jpg",       msg: "On the way to the top of the \"petit Mont Blanc\"! First day of ski touring! Never done deep powder before! That's ok you managed! I was deeply impressed! Thanks for coming with us for all those ski vacations. JP" },
  { photo: "images/letters-ella.jpg",     msg: "Hej Emma, vi har haft många bra matcher tillsammans! Det vore kul om vi kunde ha flera matcher tillsammans i framtiden. PS här var jag längre än dig ⚽️ Ella" },
  { photo: "images/letters-nike.jpg",     msg: "Grattis finaste Emma till Studenten ❤️ Liten blir stor, hoppas du får ett munspel i present 😉 — familjen Ramstedt" },
];

const wall = document.getElementById('wall');
wishes.forEach((w, i) => {
  const el = document.createElement('div');
  el.className = 'polaroid reveal';
  el.style.transitionDelay = (i % 4) * 60 + 'ms';
  const photoSlot = w.photo
    ? `<img src="${w.photo}" alt="" style="width:100%;height:100%;object-fit:cover">`
    : `<div class="ph has-frame"></div>`;
  const msgHtml = w.msg
    ? `<div class="msg">${w.msg.replace(/\n/g, '<br>')}</div>`
    : '';
  el.innerHTML = `
    <div class="ratio r-1-1">${photoSlot}</div>
    ${msgHtml}
  `;
  wall.appendChild(el);
});

// Fairy lights
function makeLights(host, count) {
  for (let i = 0; i < count; i++) {
    const l = document.createElement('span');
    l.className = 'light' + (i % 3 === 1 ? ' b' : (i % 3 === 2 ? ' c' : ''));
    l.style.left = (i + 0.5) * (100 / count) + '%';
    l.style.top = (3 + Math.sin(i * 0.9) * 4) + 'px';
    l.style.animationDelay = (i * 0.27 % 3) + 's';
    host.appendChild(l);
  }
}
makeLights(document.getElementById('topLights'), 28);

if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }});
  }, { rootMargin: '-6% 0px -6% 0px', threshold: 0.05 });
  document.querySelectorAll('.polaroid.reveal').forEach(el => io.observe(el));
}
</script>
</body>
</html>
